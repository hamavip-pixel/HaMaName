
name: Build HaMaName dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build HaMaName.dylib
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          if [ ! -d "$THEOS/sdks" ] || [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi

      - name: Verify project files
        run: |
          test -f Makefile || { echo "Makefile missing"; exit 1; }
          test -f hama.xm || { echo "hama.xm missing"; exit 1; }

      - name: Build dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Prepare dylib
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          DYLIB_PATH="$(find .theos -type f -name 'HaMaName.dylib' -print -quit)"

          if [ -z "$DYLIB_PATH" ]; then
            echo "ERROR: HaMaName.dylib was not produced!"
            find .theos -type f || true
            exit 1
          fi

          cp "$DYLIB_PATH" artifacts/HaMaName.dylib

          echo "Build successful!"
          ls -lh artifacts/HaMaName.dylib

      - name: Upload HaMaName dylib
        uses: actions/upload-artifact@v4
        with:
          name: HaMaName
          path: artifacts/HaMaName.dylib
          if-no-files-found: error
