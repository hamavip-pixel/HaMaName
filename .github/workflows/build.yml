
name: Build HaMaName dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build HaMaName.dylib
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build dylib only
        run: |
          make clean THEOS="$THEOS"
          make THEOS="$THEOS" FINALPACKAGE=1

      - name: Prepare dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          DYLIB_PATH="$(find .theos -type f -name 'HaMaName.dylib' -print -quit)"

          if [ -z "$DYLIB_PATH" ]; then
            echo "ERROR: HaMaName.dylib was not produced!"
            find .theos -maxdepth 6 -type f | sort || true
            exit 1
          fi

          cp "$DYLIB_PATH" artifacts/HaMaName.dylib
          ls -lh artifacts/HaMaName.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HaMaName
          path: artifacts/HaMaName.dylib
          if-no-files-found: error
